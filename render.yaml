# Render Blueprint: https://render.com/docs/deploy-render#deploy-infrastructure-as-code
#
# Default below: free Web Service + SQLite on ephemeral disk (data resets on redeploy).
# To persist SQLite across deploys: use a paid instance, add a `disk` block, and set
# DATABASE_URL to a path under the mount (e.g. file:/var/data/prod.db). See:
# https://render.com/docs/disks

services:
  - type: web
    name: credit-swap
    runtime: node
    region: oregon
    branch: main
    plan: free
    buildCommand: npm ci && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20.18.0"
      - key: DATABASE_URL
        value: "file:./dev.db"

# Persistent SQLite (paid tier): set `plan: starter` (or higher), add:
#   disk:
#     name: sqlite-data
#     mountPath: /var/data
#     sizeGB: 1
# and set DATABASE_URL to `file:/var/data/prod.db` in envVars above.
